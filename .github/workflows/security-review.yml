name: 🔐 Comprehensive Security Review

on:
  workflow_dispatch:
    inputs:
      api_base_url:
        description: "Live API base URL for DAST (optional)"
        required: false
        default: ""
      severity_threshold:
        description: "Fail on severity (CRITICAL/HIGH/MEDIUM)"
        required: false
        default: "CRITICAL"

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  # ─────────────────────────────────────────────
  # JOB 1: Detect Backend Technology
  # ─────────────────────────────────────────────
  detect-stack:
    name: 🔍 Detect Backend Technology
    runs-on: ubuntu-latest
    outputs:
      stack: ${{ steps.detect.outputs.stack }}
      has_php: ${{ steps.detect.outputs.has_php }}
      has_node: ${{ steps.detect.outputs.has_node }}
      has_python: ${{ steps.detect.outputs.has_python }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Detect Technology Stack
        id: detect
        run: |
          echo "🔍 Detecting backend technology stack..."
          
          HAS_PHP=false
          HAS_NODE=false
          HAS_PYTHON=false
          STACK="unknown"
          
          if find . -name "*.php" | head -1 | grep -q ".php"; then
            HAS_PHP=true; STACK="PHP/MySQL"
            echo "  ✅ PHP backend detected"
          fi
          if [ -f "package.json" ] || find . -name "package.json" -not -path "*/node_modules/*" | head -1 | grep -q "package.json"; then
            HAS_NODE=true
            echo "  ✅ Node.js detected"
          fi
          if find . -name "*.py" -not -path "*/.github/*" | head -1 | grep -q ".py"; then
            HAS_PYTHON=true
            echo "  ✅ Python detected"
          fi
          
          if find . -name "pom.xml" | grep -q "pom.xml"; then
            STACK="Java/Spring"
            echo "  ✅ Java/Spring detected"
          fi
          
          echo "stack=$STACK" >> $GITHUB_OUTPUT
          echo "has_php=$HAS_PHP" >> $GITHUB_OUTPUT
          echo "has_node=$HAS_NODE" >> $GITHUB_OUTPUT
          echo "has_python=$HAS_PYTHON" >> $GITHUB_OUTPUT
          echo "📊 Stack: $STACK"

  # ─────────────────────────────────────────────
  # JOB 2: SAST — Semgrep Static Analysis
  # ─────────────────────────────────────────────
  sast-semgrep:
    name: 🧪 SAST — Semgrep
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep (PHP + JS Security Rules)
        run: |
          mkdir -p security-reports
          
          # PHP Security rules
          semgrep --config=p/php \
                  --config=p/owasp-top-ten \
                  --config=p/sql-injection \
                  --config=p/javascript \
                  --json \
                  --output=security-reports/semgrep-results.json \
                  --no-error \
                  . || true
          
          echo "✅ Semgrep scan complete"
          
          # Convert to readable format
          python3 - <<'PYEOF'
          import json, os

          try:
              with open("security-reports/semgrep-results.json") as f:
                  data = json.load(f)
              
              results = data.get("results", [])
              print(f"\n📊 Semgrep found {len(results)} findings\n")
              
              severity_counts = {"ERROR": 0, "WARNING": 0, "INFO": 0}
              findings_md = []
              
              for r in results:
                  sev = r.get("extra", {}).get("severity", "INFO")
                  severity_counts[sev] = severity_counts.get(sev, 0) + 1
                  msg = r.get("extra", {}).get("message", "")
                  path = r.get("path", "")
                  line = r.get("start", {}).get("line", 0)
                  rule = r.get("check_id", "")
                  findings_md.append(f"| {sev} | {rule} | {path}:{line} | {msg[:100]} |")
              
              with open("security-reports/semgrep-summary.md", "w") as f:
                  f.write("# Semgrep SAST Results\n\n")
                  f.write(f"**Total Findings:** {len(results)}\n\n")
                  f.write(f"- 🔴 Errors: {severity_counts.get('ERROR', 0)}\n")
                  f.write(f"- 🟡 Warnings: {severity_counts.get('WARNING', 0)}\n")
                  f.write(f"- 🔵 Info: {severity_counts.get('INFO', 0)}\n\n")
                  f.write("| Severity | Rule | Location | Message |\n")
                  f.write("|----------|------|----------|---------|\n")
                  f.write("\n".join(findings_md))
              
              print(f"ERROR: {severity_counts.get('ERROR',0)} | WARNING: {severity_counts.get('WARNING',0)} | INFO: {severity_counts.get('INFO',0)}")
          except Exception as e:
              print(f"Could not parse results: {e}")
              with open("security-reports/semgrep-summary.md", "w") as f:
                  f.write("# Semgrep Results\n\nNo results file found or scan did not produce output.\n")
          PYEOF

      - name: Upload Semgrep Results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: security-reports/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 3: Secret Detection — Gitleaks
  # ─────────────────────────────────────────────
  secret-detection:
    name: 🔑 Secret Detection — Gitleaks
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run Gitleaks
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITLEAKS_LICENSE: ${{ secrets.GITLEAKS_LICENSE }}
        continue-on-error: true

      - name: Run Gitleaks CLI (fallback)
        run: |
          mkdir -p security-reports
          
          # Install gitleaks
          wget -q https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz
          tar -xzf gitleaks_8.18.4_linux_x64.tar.gz gitleaks
          chmod +x gitleaks
          
          ./gitleaks detect \
            --source=. \
            --report-format=json \
            --report-path=security-reports/gitleaks-report.json \
            --no-git \
            --redact \
            --exit-code 0 || true
          
          # Parse results
          python3 - <<'PYEOF'
          import json
          try:
              with open("security-reports/gitleaks-report.json") as f:
                  findings = json.load(f)
              if findings:
                  print(f"⚠️  Gitleaks found {len(findings)} potential secrets!")
                  for f in findings:
                      print(f"  - [{f.get('RuleID','')}] {f.get('File','')}:{f.get('StartLine','')}")
              else:
                  print("✅ No secrets detected by Gitleaks")
          except:
              print("✅ No secrets detected")
          PYEOF
        continue-on-error: true

      - name: Upload Secret Scan Results
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-results
          path: security-reports/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 4: Dependency Vulnerability Scanning
  # ─────────────────────────────────────────────
  dependency-scan:
    name: 📦 Dependency Scan — Trivy
    runs-on: ubuntu-latest
    needs: detect-stack
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Trivy
        run: |
          wget -qO - https://aquasecurity.github.io/trivy-repo/deb/public.key | sudo apt-key add -
          echo "deb https://aquasecurity.github.io/trivy-repo/deb $(lsb_release -sc) main" | sudo tee -a /etc/apt/sources.list.d/trivy.list
          sudo apt-get update -qq
          sudo apt-get install -y trivy

      - name: Run Trivy Filesystem Scan
        run: |
          mkdir -p security-reports
          
          trivy fs \
            --format json \
            --output security-reports/trivy-fs-report.json \
            --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig \
            --exit-code 0 \
            . || true
          
          trivy fs \
            --format table \
            --output security-reports/trivy-fs-table.txt \
            --severity HIGH,CRITICAL \
            --scanners vuln,secret,misconfig \
            --exit-code 0 \
            . || true
          
          echo "✅ Trivy scan complete"
          cat security-reports/trivy-fs-table.txt || true

      - name: Scan Node.js Dependencies (performance-tests)
        if: needs.detect-stack.outputs.has_node == 'true'
        run: |
          mkdir -p security-reports
          
          for pkg_dir in $(find . -name "package.json" -not -path "*/node_modules/*" -exec dirname {} \;); do
            echo "Scanning: $pkg_dir"
            trivy fs \
              --format json \
              --output "security-reports/trivy-node-$(basename $pkg_dir).json" \
              --severity HIGH,CRITICAL \
              --scanners vuln \
              --exit-code 0 \
              "$pkg_dir" || true
          done

      - name: Upload Trivy Results
        uses: actions/upload-artifact@v4
        with:
          name: trivy-results
          path: security-reports/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 5: PHP-Specific Security Analysis
  # ─────────────────────────────────────────────
  php-security-analysis:
    name: 🐘 PHP Security Analysis
    runs-on: ubuntu-latest
    needs: detect-stack
    if: needs.detect-stack.outputs.has_php == 'true'
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: "8.1"
          tools: composer

      - name: Install PHP Security Scanner (PHPCS + Security Audit)
        run: |
          composer global require "squizlabs/php_codesniffer=*" || true
          composer global require "pheromone/phpcs-security-audit=*" || true
          export PATH="$HOME/.composer/vendor/bin:$PATH"
          phpcs --version || true

      - name: Run PHP CodeSniffer Security Audit
        run: |
          mkdir -p security-reports
          export PATH="$HOME/.composer/vendor/bin:$PATH"
          
          phpcs \
            --standard=Security \
            --report=json \
            --report-file=security-reports/phpcs-security.json \
            --extensions=php \
            --ignore=*/vendor/*,*/node_modules/* \
            . 2>/dev/null || true
          
          echo "✅ PHP Security audit complete"

      - name: Custom PHP Security Pattern Scanner
        run: |
          mkdir -p security-reports
          
          python3 - <<'PYEOF'
          import os, re, json
          from pathlib import Path

          patterns = {
              "SQL_INJECTION_DIRECT": (r'query\s*\(\s*["\'].*\$[^)]+\)', "CRITICAL"),
              "SQL_INJECTION_CONCAT": (r'=\s*["\']SELECT.*\.\s*\$', "CRITICAL"),
              "NO_PREPARED_STATEMENTS": (r'real_escape_string.*\$.*WHERE.*\$', "HIGH"),
              "WILDCARD_CORS": (r'Access-Control-Allow-Origin:\s*\*', "HIGH"),
              "NO_AUTH_CHECK": (r'^\s*\$_GET\[|^\s*\$_POST\[', "MEDIUM"),
              "HARDCODED_CREDENTIALS": (r'password\s*=\s*["\'][^"\']{3,}["\']', "HIGH"),
              "ERROR_DISPLAY": (r'display_errors.*=.*1|error_reporting.*E_ALL', "MEDIUM"),
              "EXEC_FUNCTIONS": (r'\b(exec|system|shell_exec|passthru|popen)\s*\(', "CRITICAL"),
              "EVAL_USAGE": (r'\beval\s*\(', "CRITICAL"),
              "FILE_INCLUDE": (r'\b(include|require)\s*\(\s*\$', "HIGH"),
              "XSS_ECHO": (r'echo\s+\$_(GET|POST|REQUEST)', "HIGH"),
              "UNSAFE_UNSERIALIZE": (r'\bunserialize\s*\(\s*\$', "HIGH"),
              "MISSING_CSRF": (r'^\s*\$data\s*=\s*json_decode', "MEDIUM"),
              "PREG_REPLACE_E": (r'preg_replace\s*\(["\'].*\/e["\']', "CRITICAL"),
              "MYSQL_ROOT_EMPTY_PWD": (r'password\s*=\s*["\']["\']', "HIGH"),
          }

          findings = []
          php_files = list(Path(".").rglob("*.php"))
          
          for fpath in php_files:
              if "vendor" in str(fpath) or ".github" in str(fpath):
                  continue
              try:
                  content = fpath.read_text(encoding="utf-8", errors="ignore")
                  lines = content.splitlines()
                  for i, line in enumerate(lines, 1):
                      for vuln_type, (pattern, severity) in patterns.items():
                          if re.search(pattern, line, re.IGNORECASE):
                              findings.append({
                                  "type": vuln_type,
                                  "severity": severity,
                                  "file": str(fpath),
                                  "line": i,
                                  "code": line.strip()[:150]
                              })
              except Exception as e:
                  pass

          with open("security-reports/php-custom-scan.json", "w") as f:
              json.dump(findings, f, indent=2)
          
          print(f"\n🔍 PHP Custom Security Scanner Results")
          print(f"   Files scanned: {len(php_files)}")
          print(f"   Total findings: {len(findings)}\n")
          
          by_severity = {}
          for f in findings:
              by_severity.setdefault(f["severity"], []).append(f)
          
          for sev in ["CRITICAL", "HIGH", "MEDIUM", "LOW"]:
              count = len(by_severity.get(sev, []))
              icon = {"CRITICAL": "🔴", "HIGH": "🟠", "MEDIUM": "🟡", "LOW": "🔵"}.get(sev, "⚪")
              print(f"  {icon} {sev}: {count}")
          
          print("\nTop Findings:")
          for f in findings[:20]:
              print(f"  [{f['severity']}] {f['type']} @ {f['file']}:{f['line']}")
              print(f"    Code: {f['code']}")
          PYEOF

      - name: Upload PHP Analysis Results
        uses: actions/upload-artifact@v4
        with:
          name: php-security-results
          path: security-reports/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 6: DAST — API Security Testing
  # ─────────────────────────────────────────────
  dast-api-testing:
    name: 🌐 DAST — API Security Testing
    runs-on: ubuntu-latest
    needs: detect-stack
    if: github.event.inputs.api_base_url != ''
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python for DAST
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install DAST dependencies
        run: pip install requests

      - name: Run DAST API Security Tests
        env:
          API_BASE_URL: ${{ github.event.inputs.api_base_url }}
        run: |
          mkdir -p security-reports
          
          python3 - <<'PYEOF'
          import requests, json, time, os
          
          BASE_URL = os.environ.get("API_BASE_URL", "").rstrip("/")
          findings = []
          
          ENDPOINTS = [
              ("POST", "/backend/user_login.php"),
              ("POST", "/backend/user_signup.php"),
              ("POST", "/backend/org_login.php"),
              ("POST", "/backend/org_signup.php"),
              ("GET",  "/backend/get_reports.php"),
              ("GET",  "/backend/get_user_reports.php"),
              ("GET",  "/backend/get_user_details.php"),
              ("GET",  "/backend/get_org_details.php"),
              ("GET",  "/backend/get_organizers.php"),
              ("GET",  "/backend/get_cleanliness_score.php"),
              ("GET",  "/backend/get_messages.php"),
              ("POST", "/backend/send_message.php"),
              ("POST", "/backend/submit_report.php"),
              ("POST", "/backend/upload_image.php"),
              ("POST", "/backend/delete_report.php"),
              ("POST", "/backend/update_report.php"),
              ("POST", "/backend/update_report_status.php"),
              ("POST", "/backend/user_reset_password.php"),
              ("POST", "/backend/org_reset_password.php"),
          ]
          
          headers_to_check = [
              "X-Frame-Options", "X-Content-Type-Options",
              "Strict-Transport-Security", "Content-Security-Policy",
              "X-XSS-Protection", "Referrer-Policy"
          ]
          
          def test_endpoint(method, path, payload=None):
              url = BASE_URL + path
              try:
                  if method == "GET":
                      resp = requests.get(url, timeout=10)
                  else:
                      resp = requests.post(url, json=payload or {}, timeout=10)
                  return resp
              except Exception as e:
                  return None
          
          print(f"🌐 DAST Testing: {BASE_URL}\n")
          
          # Test 1: Missing auth check (unauthenticated access)
          for method, path in ENDPOINTS:
              resp = test_endpoint(method, path)
              if resp and resp.status_code == 200:
                  try:
                      data = resp.json()
                      if data.get("status") == "success" and "data" in data:
                          findings.append({
                              "type": "MISSING_AUTHENTICATION",
                              "severity": "HIGH",
                              "endpoint": path,
                              "description": f"Endpoint returns data without authentication token",
                              "status_code": resp.status_code
                          })
                  except: pass
              
              # Check security headers on first successful response
              if resp and resp.status_code < 500:
                  for header in headers_to_check:
                      if header not in resp.headers:
                          findings.append({
                              "type": "MISSING_SECURITY_HEADER",
                              "severity": "MEDIUM",
                              "endpoint": path,
                              "description": f"Missing security header: {header}"
                          })
                  
                  # Check CORS wildcard
                  cors = resp.headers.get("Access-Control-Allow-Origin", "")
                  if cors == "*":
                      findings.append({
                          "type": "WILDCARD_CORS",
                          "severity": "HIGH",
                          "endpoint": path,
                          "description": "Access-Control-Allow-Origin: * allows any origin"
                      })
          
          # Test 2: SQL Injection probes (detection only)
          sqli_payloads = ["'", "' OR '1'='1", "1; DROP TABLE users--"]
          for payload in sqli_payloads:
              resp = test_endpoint("GET", f"/backend/get_user_details.php?user_id={payload}")
              if resp:
                  body = resp.text.lower()
                  if any(kw in body for kw in ["sql", "mysql", "syntax error", "warning"]):
                      findings.append({
                          "type": "SQL_INJECTION_ERROR_LEAKAGE",
                          "severity": "CRITICAL",
                          "endpoint": "/backend/get_user_details.php",
                          "description": f"SQL error message leaked with payload: {payload}"
                      })
          
          # Test 3: Password reset without token (IDOR)
          resp = test_endpoint("POST", "/backend/user_reset_password.php",
                               {"email": "test@example.com", "new_password": "test123"})
          if resp and resp.status_code == 200:
              try:
                  data = resp.json()
                  if data.get("status") == "success":
                      findings.append({
                          "type": "UNAUTHENTICATED_PASSWORD_RESET",
                          "severity": "CRITICAL",
                          "endpoint": "/backend/user_reset_password.php",
                          "description": "Password reset succeeds without OTP/token verification"
                      })
              except: pass
          
          # Test 4: Rate limiting
          start = time.time()
          success_count = 0
          for i in range(20):
              resp = test_endpoint("POST", "/backend/user_login.php",
                                   {"email": f"test{i}@test.com", "password": "wrongpassword"})
              if resp and resp.status_code == 200:
                  success_count += 1
          elapsed = time.time() - start
          if success_count >= 15:
              findings.append({
                  "type": "NO_RATE_LIMITING",
                  "severity": "HIGH",
                  "endpoint": "/backend/user_login.php",
                  "description": f"20 login attempts in {elapsed:.1f}s — no rate limiting detected"
              })
          
          with open("security-reports/dast-results.json", "w") as f:
              json.dump(findings, f, indent=2)
          
          print(f"\n📊 DAST Results: {len(findings)} findings")
          for f in findings:
              icon = {"CRITICAL":"🔴","HIGH":"🟠","MEDIUM":"🟡","LOW":"🔵"}.get(f["severity"],"⚪")
              print(f"  {icon} [{f['severity']}] {f['type']} @ {f['endpoint']}")
          PYEOF

      - name: Upload DAST Results
        uses: actions/upload-artifact@v4
        with:
          name: dast-results
          path: security-reports/
          retention-days: 30

  # ─────────────────────────────────────────────
  # JOB 7: Generate Security Reports
  # ─────────────────────────────────────────────
  generate-reports:
    name: 📊 Generate Security Reports
    runs-on: ubuntu-latest
    needs:
      - detect-stack
      - sast-semgrep
      - secret-detection
      - dependency-scan
      - php-security-analysis
    if: always()
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Report Dependencies
        run: pip install openpyxl jinja2

      - name: Download All Scan Artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-scan-results
        continue-on-error: true

      - name: Copy Scripts
        run: |
          cp scripts/generate_security_report.py . || true
          cp scripts/generate_excel_report.py . || true

      - name: Generate Security Reports
        run: |
          mkdir -p "Vulnerability Test Results"
          
          python3 - <<'PYEOF'
          import json, os, glob, datetime
          from pathlib import Path

          now = datetime.datetime.now().strftime("%Y-%m-%d %H:%M:%S UTC")
          
          # Collect all findings
          all_findings = []
          
          # Known static findings from code analysis (hardcoded from known issues)
          static_findings = [
              {
                  "id": "SEC-001",
                  "severity": "CRITICAL",
                  "type": "SQL Injection",
                  "file": "backend/user_login.php",
                  "endpoint": "POST /backend/user_login.php",
                  "line": 14,
                  "description": "String-interpolated SQL query with real_escape_string instead of prepared statements. `WHERE email='$email'` is vulnerable to second-order SQL injection.",
                  "exploit": "POST body: {\"email\": \"admin@test.com' OR '1'='1\", \"password\": \"x\"}",
                  "impact": "Authentication bypass; full database read/write access",
                  "fix": "Use PDO prepared statements: `$stmt = $pdo->prepare('SELECT id,name,password FROM users WHERE email=?'); $stmt->execute([$email]);`"
              },
              {
                  "id": "SEC-002",
                  "severity": "CRITICAL",
                  "type": "SQL Injection",
                  "file": "backend/user_signup.php",
                  "endpoint": "POST /backend/user_signup.php",
                  "line": 18,
                  "description": "INSERT query built via string interpolation even after real_escape_string. Second-order injection risk.",
                  "exploit": "Register with name `'; DROP TABLE users;--`",
                  "impact": "Data destruction; privilege escalation",
                  "fix": "Replace all string-interpolated queries with PDO prepared statements throughout the codebase."
              },
              {
                  "id": "SEC-003",
                  "severity": "CRITICAL",
                  "type": "SQL Injection",
                  "file": "backend/get_organizers.php",
                  "endpoint": "GET /backend/get_organizers.php?city=...",
                  "line": 7,
                  "description": "LIKE clause built from unsanitised GET parameter: `LIKE '%$city%'`. real_escape_string does not protect LIKE wildcards.",
                  "exploit": "GET /backend/get_organizers.php?city=%' UNION SELECT id,password,email,city FROM users--",
                  "impact": "Full database dump via UNION-based SQLi",
                  "fix": "Use prepared statement with `LIKE ?` and bind `'%' . $city . '%'`."
              },
              {
                  "id": "SEC-004",
                  "severity": "CRITICAL",
                  "type": "Unauthenticated Password Reset (No Token/OTP)",
                  "file": "backend/user_reset_password.php",
                  "endpoint": "POST /backend/user_reset_password.php",
                  "line": 28,
                  "description": "Password reset accepts only email address with no OTP, magic link, or rate-limit. Any attacker who knows a victim's email can reset their password instantly.",
                  "exploit": "POST {\"email\":\"victim@example.com\",\"new_password\":\"hacked123\"}",
                  "impact": "Full account takeover for any user",
                  "fix": "Implement time-limited OTP sent to user's email. Store hashed OTP in DB; verify before allowing password change."
              },
              {
                  "id": "SEC-005",
                  "severity": "CRITICAL",
                  "type": "Unauthenticated Password Reset (No Token/OTP)",
                  "file": "backend/org_reset_password.php",
                  "endpoint": "POST /backend/org_reset_password.php",
                  "line": 28,
                  "description": "Same unauthenticated password reset issue for organization accounts.",
