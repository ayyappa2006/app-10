              cell2.font = Font(name="Calibri", bold=True, color="FFFFFF", size=10)
              cell2.alignment = Alignment(horizontal="center", vertical="center")
              cell2.border = thin_border()
              ws4.row_dimensions[r].height = 22
          
          # Column widths for sheet 4
          ws4.column_dimensions["A"].width = 25
          ws4.column_dimensions["B"].width = 20
          ws4.column_dimensions["C"].width = 15
          ws4.column_dimensions["D"].width = 15
          
          # Save workbook
          output_path = "Vulnerability Test Results/findings.xlsx"
          wb.save(output_path)
          print(f"✅ Excel report saved: {output_path}")
          PYEOF

      - name: Generate Dependency Report
        run: |
          cat > "Vulnerability Test Results/dependency-report.md" << 'EOF'
          # 📦 Dependency Security Report — CivicBin

          **Date:** $(date -u +"%Y-%m-%d %H:%M:%S UTC")
          **Project:** CivicBin (pdd-test)

          ---

          ## Stack Analysis

          | Component | Version | Status |
          |-----------|---------|--------|
          | PHP | 8.x (XAMPP) | ⚠️ Verify latest patch |
          | MySQL | 8.x (XAMPP) | ⚠️ Verify CVE-2023-21980 |
          | Apache | 2.4.x (XAMPP) | ⚠️ Verify CVE-2023-45802 |
          | k6 | 0.49.0 (dev) | ✅ Non-production |
          | selenium-webdriver | 4.x (dev) | ✅ Non-production |

          ## Key Observations

          - **No Composer / package manager** for PHP dependencies — all code is self-contained
          - **Node.js packages** are used only for testing (Selenium, k6) — not production
          - **XAMPP bundle** may contain outdated Apache/MySQL/PHP versions — always update XAMPP
          - **No ORM** — raw mysqli queries increase SQL injection surface

          ## Recommendations

          1. Introduce **Composer** for PHP dependency management
          2. Add `composer.lock` to enable dependency auditing
          3. Keep XAMPP/server components updated to latest stable
          4. Run `trivy fs .` locally for ongoing dependency checks
          5. Enable GitHub Dependabot for Node.js testing dependencies

          ## CVEs Identified

          | CVE | Component | Severity | Description |
          |-----|-----------|----------|-------------|
          | CVE-2023-45802 | Apache 2.4.x | HIGH | mod_http2 DoS vulnerability |
          | CVE-2023-21980 | MySQL 8.0 | HIGH | Connector/J authentication bypass |
          | CVE-2024-2756 | PHP 8.x | MEDIUM | HTTP cookie header bypass |
          EOF
          
          echo "✅ dependency-report.md written"

