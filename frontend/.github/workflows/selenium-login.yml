name: Selenium E2E Tests CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Android Frontend (Contains Tests)
      uses: actions/checkout@v4
      with:
        path: civic_android_frontend

    - name: Checkout Web Frontend (Contains Pages to Test)
      uses: actions/checkout@v4
      with:
        repository: ${{ github.repository_owner }}/civic_web_frontend
        path: civic_web_frontend
        # Note: If civic_web_frontend is a private repository, you will need to authenticate:
        # token: ${{ secrets.GH_PAT }}

    - name: Set up JDK 11
      uses: actions/setup-java@v4
      with:
        java-version: '11'
        distribution: 'temurin'
        cache: 'maven'

    - name: Run Selenium Tests
      run: |
        cd civic_android_frontend/selenium_tests
        mvn test -Dweb.root="file://$GITHUB_WORKSPACE/civic_web_frontend/" -Dchrome.headless=true

    - name: Upload Test Report
      if: always()
      uses: actions/upload-artifact@v4
      with:
        name: test-reports
        path: |
          civic_android_frontend/reports/
          civic_android_frontend/selenium_tests/target/surefire-reports/
