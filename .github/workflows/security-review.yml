      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: Security-Review-Reports
          path: "Vulnerability Test Results/"
          retention-days: 90

      - name: Publish GitHub Actions Summary
        run: |
          python3 - <<'PYEOF'
          import json
          
          with open("Vulnerability Test Results/findings.json") as f:
              findings = json.load(f)
          
          counts = {"CRITICAL": 0, "HIGH": 0, "MEDIUM": 0, "LOW": 0}
          for f in findings:
              counts[f.get("severity","LOW")] = counts.get(f.get("severity","LOW"), 0) + 1
          
          total = sum(counts.values())
          score = max(0, 100 - counts["CRITICAL"]*15 - counts["HIGH"]*8 - counts["MEDIUM"]*3 - counts["LOW"])
          score_icon = "🔴" if score < 40 else "🟠" if score < 60 else "🟡" if score < 80 else "🟢"
          
          summary = f"""## 🔐 CivicBin Security Assessment Results

          | Metric | Value |
          |--------|-------|
          | 🔴 Critical | {counts['CRITICAL']} |
          | 🟠 High | {counts['HIGH']} |
          | 🟡 Medium | {counts['MEDIUM']} |
          | 🔵 Low | {counts['LOW']} |
          | **Total Findings** | **{total}** |
          | {score_icon} **Security Score** | **{score}/100** |

          ### 🚨 Top Critical Issues
          1. **No Server-Side Session Management** — Any user can impersonate any other
          2. **Unauthenticated Password Reset** — Account takeover via email alone
          3. **SQL Injection** — Multiple endpoints vulnerable to SQLi

          ### 📦 Reports
          Download the **Security-Review-Reports** artifact for:
          - `security-review.md` — Full findings with exploits & fixes
          - `executive-summary.md` — Executive summary
          - `findings.xlsx` — Excel workbook (4 sheets)
          - `dependency-report.md` — Dependency CVE analysis
          - `endpoint-inventory.md` — All 21 API endpoints
          """
          
          with open(os.environ.get("GITHUB_STEP_SUMMARY", "/dev/null"), "a") as f:
              f.write(summary)
          print(summary)
          PYEOF
        env:
          GITHUB_STEP_SUMMARY: ${{ env.GITHUB_STEP_SUMMARY }}

  # ─────────────────────────────────────────────
  # JOB 8: Security Gate — Fail on Critical
  # ─────────────────────────────────────────────
  security-gate:
    name: 🚦 Security Gate
    runs-on: ubuntu-latest
    needs: generate-reports
    if: always()
    steps:
      - name: Download Reports
        uses: actions/download-artifact@v4
        with:
          name: Security-Review-Reports
          path: reports
        continue-on-error: true

      - name: Evaluate Security Gate
        run: |
          THRESHOLD="${{ github.event.inputs.severity_threshold || 'CRITICAL' }}"
          echo "🚦 Security Gate — Threshold: $THRESHOLD"
          
          CRITICAL_COUNT=5
          HIGH_COUNT=10
          
          # Try to read actual counts from findings
          if [ -f "reports/findings.json" ]; then
            CRITICAL_COUNT=$(python3 -c "
          import json
          with open('reports/findings.json') as f:
              data = json.load(f)
          print(sum(1 for i in data if i.get('severity')=='CRITICAL'))
          " 2>/dev/null || echo "5")
          fi
          
          echo "  🔴 Critical findings: $CRITICAL_COUNT"
          
          if [ "$THRESHOLD" = "CRITICAL" ] && [ "$CRITICAL_COUNT" -gt "0" ]; then
            echo ""
            echo "❌ SECURITY GATE FAILED: $CRITICAL_COUNT CRITICAL vulnerabilities found!"
            echo ""
            echo "Critical issues found:"
            echo "  - SEC-001: SQL Injection in user_login.php"
            echo "  - SEC-002: SQL Injection in user_signup.php"
            echo "  - SEC-003: SQL Injection in get_organizers.php (UNION-based)"
            echo "  - SEC-004: Unauthenticated Password Reset (users)"
            echo "  - SEC-005: Unauthenticated Password Reset (organizations)"
            echo "  - SEC-009: No Session Management — user impersonation possible"
            echo ""
            echo "Fix these issues before merging. See Security-Review-Reports artifact."
            exit 1
          fi
          
          echo "✅ Security gate passed for threshold: $THRESHOLD"
